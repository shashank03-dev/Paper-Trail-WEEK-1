name: Keep awake
# Render's free web services spin down after 15 minutes without traffic, and the
# next visitor waits ~a minute for a cold start. Ping the site every 10 minutes
# so it stays warm. /api/config is the Render health check: it reads env only
# and never calls the model, so pings don't spend provider quota (/api/health
# would).
#
# Point it elsewhere with a repository variable: Settings → Secrets and
# variables → Actions → Variables → KEEP_AWAKE_URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the site
        env:
          URL: ${{ vars.KEEP_AWAKE_URL || 'https://paper-trail-t6mp.onrender.com/api/config' }}
        run: |
          # A cold start can take a minute; retry rather than fail on the first miss.
          curl -fsS -o /dev/null -w "%{http_code} in %{time_total}s\n" \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            -A "paper-trail-keep-awake" "$URL"
